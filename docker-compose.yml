version: '3.8'

services:
  # HDBank AI Chatbot Backend API
  hdbank-chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development  # Change to 'production' for production
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app:/app/src
    volumes:
      # Mount source code for development
      - .:/app
      # Mount logs directory
      - ./logs:/app/logs
      # Mount data directory
      - ./data:/app/data
      # Mount config directory
      - ./config:/app/config
    depends_on:
      - redis
    networks:
      - hdbank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching và session storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hdbank-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database (optional - nếu cần persist conversations)
  # postgres:
  #   image: postgres:15-alpine
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB: hdbank_chatbot
  #     POSTGRES_USER: hdbank
  #     POSTGRES_PASSWORD: hdbank_password_change_in_production
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - hdbank-network
  #   restart: unless-stopped

  # Nginx reverse proxy (optional)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - hdbank-chatbot-api
  #   networks:
  #     - hdbank-network
  #   restart: unless-stopped

  # Prometheus monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - hdbank-network
    restart: unless-stopped

  # Grafana dashboard (optional)
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin_change_in_production
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - hdbank-network
  #   restart: unless-stopped

  # Jupyter Notebook for development và analysis (optional)
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - .:/app
      - ./notebooks:/app/notebooks
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''", "--NotebookApp.password=''"]
    networks:
      - hdbank-network
    restart: unless-stopped
    profiles:
      - dev  # Only start with --profile dev

volumes:
  redis_data:
    driver: local
  # postgres_data:
  #   driver: local
  prometheus_data:
    driver: local
  # grafana_data:
  #   driver: local

networks:
  hdbank-network:
    driver: bridge

# Development override - use with docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
---
# docker-compose.dev.yml content (for development)
version: '3.8'

services:
  hdbank-chatbot-api:
    build:
      target: development
    environment:
      - ENV=development
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app:delegated  # Better performance on macOS
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]

# Production override - use with docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
---
# docker-compose.prod.yml content (for production)
version: '3.8'

services:
  hdbank-chatbot-api:
    build:
      target: production
    environment:
      - ENV=production
      - LOG_LEVEL=WARNING
    volumes:
      # Only mount necessary directories in production
      - ./logs:/app/logs:rw
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M